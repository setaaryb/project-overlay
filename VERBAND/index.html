<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, initial-scale=1.0">
    <title>OVERLAY LAGA CS</title>
    <style>
        @font-face { 
            font-family: 'tactic'; 
            src: url('../asset/TacticSans-Bld.ttf'); 
        }
        
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 1920px; 
            height: 1080px; 
            overflow: hidden; 
            background-color: rgba(0,0,0,0);
            font-family: Arial, sans-serif; 
        }

        .container { 
            position: relative; 
            width: 100%; 
            height: 100%; 
        }

        .score-left, .score-right {
            font-family: 'tactic';
            position: absolute;
            top: 8px;
            font-size: 40px;
            color: rgb(255, 255, 255);
            z-index: 10;
            width: 50px;
            text-align: center;
        }
        .score-left { left: 823px; }
        .score-right { right: 824px; }

        .header-overlay { 
            width: 100%; 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 10; 
        }

        .header-overlay img { 
            width: 100%; 
            display: block; 
        }

        .team-name { 
            font-family: 'tactic'; 
            position: absolute; 
            top: 19px; 
            font-size: 25px; 
            color: white; 
            z-index: 20; 
            text-transform: uppercase; 
            width: 350px;
        }

        .left-team { left: 510px; text-align: left; }
        .right-team { right: 510px; text-align: right; }

        .team-logo { 
            position: absolute; 
            top: 2px; 
            width: 65px; 
            height: 65px; 
            object-fit: contain; 
            z-index: 20; 
        }

        .left-logo { left: 429px; }
        .right-logo { right: 429px; }

        .circle { 
            width: 10px; 
            height: 10px; 
            border-radius: 0%; 
            background: white; 
            transition: background 0.3s; 
            border: 3px solid rgba(0,0,0,0.2);
        }

        .left-circles { 
            position: absolute; 
            top: 27px; 
            left: 743px; 
            display: flex; 
            gap: 5px; 
            z-index: 5; 
        }

        .right-circles { 
            position: absolute; 
            top: 26px; 
            right: 745px; 
            display: flex; 
            gap: 5px; 
            z-index: 5; 
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-overlay">
        <img src="../asset/sbb.png" alt="Header">
    </div>
    
    <div id="scoreLeft" class="score-left">0</div>
    <div id="scoreRight" class="score-right">0</div>

    <img id="logoLeft" class="team-logo left-logo">
    <img id="logoRight" class="team-logo right-logo">

    <div class="left-circles">
        <div id="l3" class="circle"></div>
        <div id="l2" class="circle"></div>
        <div id="l1" class="circle"></div>
    </div>

    <div class="right-circles">
        <div id="r1" class="circle"></div>
        <div id="r2" class="circle"></div>
        <div id="r3" class="circle"></div>
    </div>

    <div id="teamLeft" class="team-name left-team">TEAM LEFT</div>
    <div id="teamRight" class="team-name right-team">TEAM RIGHT</div>
</div>

<script>
    function updateDisplay() {

        document.getElementById("teamLeft").innerText = localStorage.getItem("teamLeft") || "TEAM LEFT";
        document.getElementById("teamRight").innerText = localStorage.getItem("teamRight") || "TEAM RIGHT";

        const lLogo = localStorage.getItem("logoLeft");
        const rLogo = localStorage.getItem("logoRight");

        document.getElementById("scoreLeft").innerText = localStorage.getItem("scoreLeft") || "0";
        document.getElementById("scoreRight").innerText = localStorage.getItem("scoreRight") || "0";

        if(lLogo) document.getElementById("logoLeft").src = lLogo;
        if(rLogo) document.getElementById("logoRight").src = rLogo;

        // Update Points (Kuning jika true, Putih jika false)
        document.getElementById("l1").style.backgroundColor = localStorage.getItem("l1") === "true" ? "yellow" : "white";
        document.getElementById("l2").style.backgroundColor = localStorage.getItem("l2") === "true" ? "yellow" : "white";
        document.getElementById("l3").style.backgroundColor = localStorage.getItem("l3") === "true" ? "yellow" : "white";
        document.getElementById("r1").style.backgroundColor = localStorage.getItem("r1") === "true" ? "yellow" : "white";
        document.getElementById("r2").style.backgroundColor = localStorage.getItem("r2") === "true" ? "yellow" : "white";
        document.getElementById("r3").style.backgroundColor = localStorage.getItem("r3") === "true" ? "yellow" : "white";
    }

    window.addEventListener('storage', updateDisplay);

    updateDisplay();
</script>
</body>
</html>
