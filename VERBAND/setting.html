<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control Panel - OVERLAY LAGA CS</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #D84040;
            --primary-glow: rgba(255, 0, 0, 0.598);
            --bg: #151515;
            --card: #1a1a1a;
            --card-hover: #222;
            --text: #ffffff;
            --text-dim: #a0a0a0;
            --accent: #2ecc71;
            --accent-glow: rgba(46, 204, 113, 0.3);
            --danger: #ff4757;
            --border: #333;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            background-image: radial-gradient(circle at 50% -20%, #222, #0f0f0f);
            color: var(--text);
            margin: 0;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            margin: 0;
            letter-spacing: 2px;
            color: var(--primary);
            font-size: 26px;
            font-weight: 800;
            text-transform: uppercase;
            text-shadow: 0 0 20px var(--primary-glow);
        }

        .credit {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 8px;
            letter-spacing: 1px;
        }
        .credit b { color: var(--primary); }

        .container {
            width: 100%;
            max-width: 900px;
            box-sizing: border-box;
        }

        .panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(1fr, 1fr)); 
            gap: 20px;
        }

        @media (min-width: 768px) {
            .panel {
                grid-template-columns: repeat(2, 1fr);
            }
            h1 {
                font-size: 32px;
                letter-spacing: 4px;
            }
        }

        .group {
            background: var(--card);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
        }

        .group::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--primary);
        }

        h2 {
            margin: 0 0 20px;
            font-size: 16px;
            font-weight: 800;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .field { margin-bottom: 18px; }

        .field label {
            display: block;
            font-size: 11px;
            color: var(--text-dim);
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        input[type=text], input[type=number] {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #252525;
            color: white;
            font-size: 14px;
            transition: 0.2s;
        }

        input[type=text]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .upload-box {
            background: #252525;
            border: 1px dashed #555;
            padding: 10px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            box-sizing: border-box;
        }
        .upload-box input { font-size: 12px; width: 100%; color: var(--text-dim); }

        .skor-control {
            display: flex; 
            gap: 10px;
            align-items: center;
        }
        .btn-plus {
            padding: 12px 20px;
            background: var(--primary); 
            border: none; 
            color: black; 
            font-weight: 800; 
            font-size: 15px;
            border-radius: 10px; 
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }
        .btn-plus:active {
            transform: scale(0.95);
        }

        .points-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .checkbox {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #252525;
            padding: 12px 5px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
            font-size: 12px;
            font-weight: 700;
            text-align: center;
            user-select: none;
        }
        .checkbox input { display: none; }

        .checkbox:has(input:checked) {
            background: rgba(46, 204, 113, 0.1);
            border-color: var(--accent);
            color: var(--accent);
        }

        .actions {
            margin-top: 35px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        @media (min-width: 576px) {
            .actions {
                flex-direction: row;
                justify-content: center;
            }
        }

        .btn-action {
            padding: 14px 30px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid transparent;
            width: 100%;
        }

        @media (min-width: 576px) {
            .btn-action {
                width: auto;
                min-width: 180px;
            }
        }

        .swipe {
            background: transparent;
            border-color: var(--accent);
            color: var(--accent);
        }
        .swipe:hover, .swipe:active {
            background: var(--accent);
            color: black;
            box-shadow: 0 5px 15px var(--accent-glow);
        }

        .reset {
            background: transparent;
            border-color: var(--danger);
            color: var(--danger);
        }
        .reset:hover, .reset:active {
            background: var(--danger);
            color: white;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.3);
        }

        #status {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 25px;
            background: var(--accent);
            color: black;
            border-radius: 30px;
            font-weight: 800;
            font-size: 13px;
            display: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 100;
        }
    </style>
</head>
<body>

<header>
    <h1>Control Panel</h1>
    <div class="credit">EST. 2026 • DESIGNED BY <b>SETA</b></div>
</header>

<div class="container">
    <div class="panel">
        <div class="group">
            <h2>TIM KIRI</h2>
            <div class="field">
                <label>Team Name</label>
                <input type="text" id="inLeft" placeholder="Masukkan nama tim..." oninput="save('teamLeft',this.value)">
            </div>

            <div class="field">
                <label>Team Score (Max 7)</label>
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="inScoreLeft" min="0" max="7" value="0" readonly style="width: 70%; box-sizing: border-box; padding: 12px 15px; border-radius: 10px; border: 1px solid var(--border); background: #252525; color: white;">
                    <button type="button" onclick="tambahSkor('left')" style="width: 30%; background: var(--primary); border: none; color: black; font-weight: 800; border-radius: 10px; cursor: pointer;">+1</button>
                </div>
            </div>

            <div class="field">
                <label>Team Logo</label>
                <div class="upload-box">
                    <input type="file" accept="image/*" onchange="uploadImage(event,'logoLeft')">
                </div>
            </div>

            <div class="field">
                <label>Match Points</label>
                <div class="points-container">
                    <label class="checkbox">
                        <input type="checkbox" id="cl1" onchange="save('l1',this.checked)"> Win 1
                    </label>
                    <label class="checkbox">
                        <input type="checkbox" id="cl2" onchange="save('l2',this.checked)"> Win 2
                    </label>
                    <label class="checkbox">
                        <input type="checkbox" id="cl3" onchange="save('l3',this.checked)"> Win 3
                    </label>
                </div>
            </div>
        </div>

        <div class="group">
            <h2>TIM KANAN</h2>
            <div class="field">
                <label>Team Name</label>
                <input type="text" id="inRight" placeholder="Masukkan nama tim..." oninput="save('teamRight',this.value)">
            </div>

            <div class="field">
                <label>Team Score (Max 7)</label>
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="inScoreRight" min="0" max="7" value="0" readonly style="width: 70%; box-sizing: border-box; padding: 12px 15px; border-radius: 10px; border: 1px solid var(--border); background: #252525; color: white;">
                    <button type="button" onclick="tambahSkor('right')" style="width: 30%; background: var(--primary); border: none; color: black; font-weight: 800; border-radius: 10px; cursor: pointer;">+1</button>
                </div>
            </div>

            <div class="field">
                <label>Team Logo</label>
                <div class="upload-box">
                    <input type="file" accept="image/*" onchange="uploadImage(event,'logoRight')">
                </div>
            </div>

            <div class="field">
                <label>Match Points</label>
                <div class="points-container">
                    <label class="checkbox">
                        <input type="checkbox" id="cr1" onchange="save('r1',this.checked)"> Win 1
                    </label>
                    <label class="checkbox">
                        <input type="checkbox" id="cr2" onchange="save('r2',this.checked)"> Win 2
                    </label>
                    <label class="checkbox">
                        <input type="checkbox" id="cr3" onchange="save('r3',this.checked)"> Win 3
                    </label>
                </div>
            </div>
        </div>
    </div>

    <div class="actions">
        <button class="btn-action swipe" onclick="swipeTeams()">Swipe Teams</button>
        <button class="btn-action reset" style="border-color: #e67e22; color: #e67e22;" onmouseover="this.style.backgroundColor='#e67e22'; this.style.color='white'" onmouseout="this.style.backgroundColor='transparent'; this.style.color='#e67e22'" onclick="resetScore()">Reset Score</button>
        <button class="btn-action reset" onclick="resetAll()">Reset All Data</button>
    </div>
</div>

<div id="status">Data tersimpan!</div>

<script>
    function showStatus() {
        const s = document.getElementById('status');
        s.style.display = 'block';
        setTimeout(() => s.style.display = 'none', 1500);
    }

    function save(key, value){
        localStorage.setItem(key, value);
        if(typeof value === 'boolean') showStatus();
    }

    function uploadImage(event, key){
        const file = event.target.files[0];
        if(!file) return;

        const reader = new FileReader();
        reader.onload = function(e){
            localStorage.setItem(key, e.target.result);
            updatePreview(key, e.target.result);
            showStatus();
        }
        reader.readAsDataURL(file);
    }

    function updatePreview(key, src) {
        if(key === 'logoEvent') {
            document.getElementById('prev-logoEvent').innerHTML = `<img src="${src}">`;
        }
    }

    function resetScore() {
            if (confirm("Apakah Anda yakin ingin me-reset skor kedua tim menjadi 0?")) {
                localStorage.setItem("scoreLeft", "0");
                localStorage.setItem("scoreRight", "0");

                document.getElementById("inScoreLeft").value = 0;
                document.getElementById("inScoreRight").value = 0;

                showStatus();

                window.dispatchEvent(new Event('storage'));
            }
        }

    function tambahSkor(side) {
        if (side === 'left') {
            let scoreLeft = parseInt(localStorage.getItem("scoreLeft")) || 0;
            
            if (scoreLeft >= 7) {
                alert("Skor Tim Kiri sudah mencapai batas maksimal 7!");
                return;
            }
            
            scoreLeft += 1;
            localStorage.setItem("scoreLeft", scoreLeft);
            document.getElementById("inScoreLeft").value = scoreLeft;
            
        } else if (side === 'right') {
            let scoreRight = parseInt(localStorage.getItem("scoreRight")) || 0;
            
            if (scoreRight >= 7) {
                alert("Skor Tim Kanan sudah mencapai batas maksimal 7!");
                return;
            }
            
            scoreRight += 1;
            localStorage.setItem("scoreRight", scoreRight);
            document.getElementById("inScoreRight").value = scoreRight;
        }

        showStatus();
        window.dispatchEvent(new Event('storage'));
    }

    function resetAll(){
        if(confirm("Apakah Anda yakin ingin menghapus semua data overlay?")){
            localStorage.clear();
            location.reload();
        }
    }

    function swipeTeams() {
        if (!confirm("Apakah Anda yakin ingin menukar posisi Tim Kiri dan Tim Kanan?")) return;

        const teamLeft = localStorage.getItem("teamLeft") || "";
        const teamRight = localStorage.getItem("teamRight") || "";
        
        const scoreLeft = localStorage.getItem("scoreLeft") || "0";
        const scoreRight = localStorage.getItem("scoreRight") || "0";
        
        const logoLeft = localStorage.getItem("logoLeft") || "";
        const logoRight = localStorage.getItem("logoRight") || "";
        
        const l1 = localStorage.getItem("l1") || "false";
        const l2 = localStorage.getItem("l2") || "false";
        const l3 = localStorage.getItem("l3") || "false";
        const r1 = localStorage.getItem("r1") || "false";
        const r2 = localStorage.getItem("r2") || "false";
        const r3 = localStorage.getItem("r3") || "false";

        localStorage.setItem("teamLeft", teamRight);
        localStorage.setItem("teamRight", teamLeft);
        
        localStorage.setItem("scoreLeft", scoreRight);
        localStorage.setItem("scoreRight", scoreLeft);

        if (logoRight) localStorage.setItem("logoLeft", logoRight); else localStorage.removeItem("logoLeft");
        if (logoLeft) localStorage.setItem("logoRight", logoLeft); else localStorage.removeItem("logoRight");
        
        localStorage.setItem("l1", r1);
        localStorage.setItem("l2", r2);
        localStorage.setItem("l3", r3);
        localStorage.setItem("r1", l1);
        localStorage.setItem("r2", l2);
        localStorage.setItem("r3", l3);

        location.reload();
    }

    window.onload = () => {
        document.getElementById("inLeft").value = localStorage.getItem("teamLeft") || "";
        document.getElementById("inRight").value = localStorage.getItem("teamRight") || "";

        document.getElementById("inScoreLeft").value = localStorage.getItem("scoreLeft") || "0";
        document.getElementById("inScoreRight").value = localStorage.getItem("scoreRight") || "0";

        document.getElementById("cl1").checked = localStorage.getItem("l1") === "true";
        document.getElementById("cl2").checked = localStorage.getItem("l2") === "true";
        document.getElementById("cl3").checked = localStorage.getItem("l3") === "true";
        document.getElementById("cr1").checked = localStorage.getItem("r1") === "true";
        document.getElementById("cr2").checked = localStorage.getItem("r2") === "true";
        document.getElementById("cr3").checked = localStorage.getItem("r3") === "true";

        const savedLogo = localStorage.getItem("logoEvent");
        if(savedLogo) updatePreview('logoEvent', savedLogo);
    }
</script>
</body>
</html>
